url: https://github.com/aksruchi/HaploBreedR

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2C7FB8"
    secondary: "#F0A830"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/aksruchi/HaploBreedR
      aria-label: GitHub repository

home:
  title: "High-Resolution Functional Haplotype Discovery and Genomic Selection"
  description: |
    An end-to-end quantitative genomics and molecular breeding suite
    for crops. Identifies superior functional haplotypes from coding
    variants under false discovery rate control and conducts haplotype-guided
    genomic selection, analytical cross usefulness prediction, and linkage-aware
    pyramiding optimization.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
  - title: "Pipeline: Superior Haplotype Discovery"
    desc: >
      End-to-end and modular tools for functional variant identification,
      intragenic haplotype assembly, association testing, and gate
      re-application. See `haplobreed_analysis()` for the single-trait
      pipeline; the remaining functions are the per-step entry points.
    contents:
      - haplobreed_analysis
      - hbr_check_inputs
      - hbr_generate_input_qc_report
      - hbr_read_results
      - hbr_gene_carriers
      - hbr_regate

  - title: "Genomic Selection & Breeding Decisions (HGSI)"
    desc: >
      Two-kernel spectral REML prediction, cross usefulness, multi-locus
      pyramiding, haplotype-block calling, and parent-set optimization.
      `hbr_fit_models()` and `hbr_cross_design()` are the two halves of
      the pipeline; `hbr_advanced_decision()` runs them end to end.
    contents:
      - hbr_advanced_decision
      - hbr_fit_models
      - hbr_cross_design
      - hbr_cross_plan
      - hbr_cross_usefulness
      - hbr_haplotype_blocks
      - hbr_haplotype_block_table
      - hbr_pyramid_probability
      - hbr_population_size
      - hbr_build_grm
      - hbr_reml_two_kernel
      - hbr_trait_conflicts

  - title: "Publication Figures & Visualisation"
    desc: >
      High-level ggplot2 publication graphics for candidate genes,
      haplotype networks, gene models, LD structure, cross rankings,
      and model validation.
    contents:
      - hbr_plot_haplotype
      - hbr_plot_gene_structure
      - hbr_plot_haplotype_network
      - hbr_plot_cross_ranking
      - hbr_plot_cv_forest

  - title: "Variant Annotation & Population Genetics"
    desc: >
      LD decay estimation, GFF3 gene parsing, genomic-region interval
      intersection, and GO term over-representation.
    contents:
      - hbr_annotate_regions_with_genes
      - hbr_read_gff3_genes
      - hbr_go_enrichment

  - title: "Manuscript Tables & Reporting"
    desc: >
      Formatted multi-sheet Excel manuscript tables built from a single
      pipeline run.
    contents:
      - hbr_build_manuscript_tables

  - title: "Reference Data, Themes & Lookups"
    desc: >
      Genetic linkage maps, crop genome metadata, colour palettes, and
      ggplot2 themes shipped with the package.
    contents:
      - hbr_rice_genetic_map
      - hbr_crop_lookup
      - hbr_palette
      - hbr_palette_names
      - hbr_theme
      - hbr_theme_names

  - title: "S3 methods for pipeline and fit objects"
    desc: >
      Print, summary, and plot methods for the classed objects the
      pipeline returns.
    contents:
      - print.hbr_run
      - summary.hbr_run
      - plot.hbr_run
      - print.hgsi_fit
      - summary.hgsi_fit
      - print.hgsi_advanced
      - summary.hgsi_advanced
      - plot.hgsi_advanced

  - title: "S3 methods for reference and QC objects"
    desc: >
      Print methods for the small classed objects returned by the input
      validation and reference-loading layers.
    contents:
      - print.hbr_reference
      - print.hbr_sequence_qc
      - print.hbr_compat_report
      - print.hbr_id_report
      - print.hbr_genotype

articles:
  - title: "Get started"
    contents:
      - HaploBreedR

figures:
  dev: "png"
  dpi: 300

development:
  mode: release